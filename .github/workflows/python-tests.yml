name: Python CI

on: [push, pull_request]

jobs:
  python:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Requis pour builder postflop-solver-py (maturin/pyo3, dépendance locale).
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            python_bindings/target
          key: cargo-${{ runner.os }}-pyo3-${{ hashFiles('python_bindings/Cargo.lock') }}

      - name: Sync dependencies (uv.lock, repro)
        run: uv sync --frozen --extra dev

      # Phase 0.10 — le lockfile est la source de vérité : échoue si uv.lock
      # et pyproject.toml divergent.
      - name: Lock check (uv lock --check)
        run: uv lock --check

      # Phase 5 — gate lint complet [E,F,W,I,B,C4,UP] : nettoyage termine
      # (autofix I/UP/C4/W + format ruff, corrections manuelles B/E722/B905/F841,
      # per-file-ignores documentes pour les E402 des points d'entree).
      - name: Ruff (set complet)
        run: uv run ruff check src tests poker/tools

      # Phase 4.1 — ratchet : baseline 37% -> 39% -> 42% -> 45% -> 50% -> 52% (2026-08-26).
      # Gate 52% aujourd'hui ; objectif long terme 60%.
      # NB : le package legacy poker/ (~10.5k stmts, ~12% couvert) dilue la metrique globale ;
      # src/ seul est a ~84%. Perimetre de mesure a trancher separement.
      # poker/tests reste hors collecte par défaut (lancé par scripts/run_refonte_ci.py).
      - name: Tests + coverage
        run: uv run pytest --cov=src --cov=poker --cov-report=term-missing --cov-report=xml --cov-fail-under=52

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Dependency audit (pip-audit, advisory)
        run: uv run pip-audit --skip-editable
