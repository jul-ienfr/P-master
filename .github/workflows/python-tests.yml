name: Python CI

on: [push, pull_request]

jobs:
  python:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Requis pour builder postflop-solver-py (maturin/pyo3, dépendance locale).
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            python_bindings/target
          key: cargo-${{ runner.os }}-pyo3-${{ hashFiles('python_bindings/Cargo.lock') }}

      - name: Sync dependencies (uv.lock, repro)
        run: uv sync --frozen --extra dev

      # Phase 0.10 — le lockfile est la source de vérité : échoue si uv.lock
      # et pyproject.toml divergent.
      - name: Lock check (uv lock --check)
        run: uv lock --check

      # Phase 5 — gate lint complet [E,F,W,I,B,C4,UP] : nettoyage termine
      # (autofix I/UP/C4/W + format ruff, corrections manuelles B/E722/B905/F841,
      # per-file-ignores documentes pour les E402 des points d'entree).
      - name: Ruff (set complet)
        run: uv run ruff check src tests poker/tools

      # Phase 4.1 — ratchet : baseline 37% -> 39% -> 42% -> 45% -> 50% -> 52% (2026-08-26).
      # Gate 52% aujourd'hui ; objectif long terme 60%.
      # F-14 (tranché le 19/11/2026, ADR-001) : `poker/` est le laboratoire
      # historique, hors production — il reste hors lint et hors couverture
      # bloquante. La couverture de `src/` (seule base de production) est
      # mesurée séparément ci-dessous avec son propre seuil.
      - name: Tests + coverage
        run: uv run pytest --cov=src --cov=poker --cov-report=term-missing --cov-report=xml --cov-fail-under=52

      # F-14 — seuil bloquant indépendant pour `src/` (critère n°1 de l'ADR-001).
      # Mesuré à 83 % le 19/11/2026 ; marge de 3 points sous la mesure.
      # Réutilise les données `.coverage` du pas précédent : aucun second run.
      - name: Coverage src/ (seuil production)
        run: uv run coverage report --include="src/*" --fail-under=80

      # F-09 — gate de performance : latence froide comparée à la baseline
      # versionnée (`research/results/perf_baseline.json`), seuil de régression
      # 10 % + bruit machine. Zéro fallback toléré sur le corpus de référence.
      - name: Performance gate (p95 vs baseline)
        run: uv run python scripts/check_perf_gate.py --repeat 3

      # Spec 013 — gate d'exploitabilité : second volet de la constitution §III
      # (« régression > 10 % sur le p95 OU sur l'exploitabilité »). L'exploitabilité
      # à itérations fixées est déterministe bit-à-bit et invariante au nombre de
      # threads (mesuré), donc portable — là où la latence ne l'était pas.
      # Baseline versionnée : `research/results/exploitability_baseline.json`.
      - name: Exploitability gate (iterations vs baseline)
        run: uv run python scripts/check_exploitability_gate.py

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Dependency audit (pip-audit, advisory)
        run: uv run pip-audit --skip-editable

      # SBOM CycloneDX des dépendances Python (F-19). `pip-audit` sait déjà le
      # produire : aucun outil supplémentaire n'est nécessaire. L'artefact est
      # joint au run, jamais committé (il change à chaque montée de dépendance).
      - name: SBOM (CycloneDX, Python)
        if: always()
        run: uv run pip-audit --skip-editable -f cyclonedx-json -o sbom-python.cdx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-python
          path: sbom-python.cdx.json
          if-no-files-found: ignore
