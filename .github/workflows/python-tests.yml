name: Python CI

on: [push, pull_request]

jobs:
  python:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies (uv.lock, repro)
        run: uv sync --frozen --extra dev

      # Phase 4.2 — adoption progressive : seuls les codes bloquants à l'exécution
      # sont des gates aujourd'hui ; le set complet [E,F,W,I,B,C4,UP] suivra
      # après nettoyage (~2000 findings actuels).
      - name: Ruff (codes bloquants)
        run: |
          uv run ruff check src --select E9,F63,F7,F82
          uv run ruff check tests --select E9,F63,F7,F82
          uv run ruff check poker/tools --select E9,F63,F7,F82

      # Phase 4.1 — baseline mesurée 37% (2026-08-24). Gate démarré à 35%,
      # ratchet +5%/sprint jusqu'à 60%. poker/tests reste hors collecte par
      # défaut (lancé par scripts/run_refonte_ci.py).
      - name: Tests + coverage
        run: uv run pytest --cov=src --cov=poker --cov-report=term-missing --cov-report=xml --cov-fail-under=35

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      # Non bloquant tant que les pins legacy (torch 2.5 côté requirements miroir,
      # transitive deps) n'ont pas été audités et corrigés.
      - name: Dependency audit (pip-audit, advisory)
        continue-on-error: true
        run: uv run pip-audit --skip-editable
