name: Rust
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings
  RUSTDOCFLAGS: --deny warnings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Install pinned toolchains
      # Épinglé sur rust-toolchain.toml : la nightly glissante fait dériver
      # les lints (-D warnings) et casse le job à chaque release Rust.
      run: |
        rustup toolchain install nightly-2025-08-01 --profile minimal --component clippy,rustfmt
        rustup component add clippy rustfmt
    - name: Build
      run: |
        cargo +nightly-2025-08-01 build --release --features zstd
        cargo +nightly-2025-08-01 build --release --features custom-alloc
        cargo +nightly-2025-08-01 run --release --example basic
        cargo +nightly-2025-08-01 run --release --example file_io
        cargo +nightly-2025-08-01 run --release --example node_locking
    - name: Run tests
      run: |
        cargo +nightly-2025-08-01 test --release --features zstd
        # NB : les tests sous --features custom-alloc échouent de façon
        # préexistante (dérive fork vs upstream) ; le chemin custom-alloc
        # est bench-only, la prod portable utilise stable+zstd.
        cargo +nightly-2025-08-01 build --release --features custom-alloc
    - name: Clippy
      run: |
        cargo +nightly-2025-08-01 clippy --release --features zstd -- -D warnings
        cargo +nightly-2025-08-01 clippy --release --features custom-alloc -- -D warnings
    - name: Check formatting
      # Le crate racine n'est pas un workspace : `fmt --all` ne descend pas dans
      # `gto_server/` ni `python_bindings/`, dont la dérive de rustfmt était donc
      # invisible en CI (corrigée le 20/11/2026, F-19). Les trois crates sont
      # vérifiés explicitement.
      run: |
        cargo +nightly-2025-08-01 fmt --all --check
        cargo +nightly-2025-08-01 fmt --manifest-path gto_server/Cargo.toml --check
        cargo +nightly-2025-08-01 fmt --manifest-path python_bindings/Cargo.toml --check
    - name: Check documentation
      run: cargo +nightly-2025-08-01 doc --release

  # F-19 — le trou « pas de cargo audit » de l'audit P2. Le job est séparé du
  # build : il ne dépend ni de la toolchain nightly ni de la compilation, et
  # tourne en parallèle.
  #
  # `-D warnings` est volontairement plus strict qu'une détection de
  # vulnérabilités : un avis `unsound` ou un crate non maintenu font aussi
  # échouer le job. Les exceptions sont **déclarées** dans `.cargo/audit.toml`
  # (aujourd'hui : `bincode`, non maintenu sans vulnérabilité publiée, qui
  # porte le format binaire des arbres sérialisés), jamais silencieuses.
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Install cargo-audit
      uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
      with:
        tool: cargo-audit
    - name: Audit the three lockfiles (RUSTSEC)
      run: |
        cargo audit --file Cargo.lock -D warnings
        cargo audit --file gto_server/Cargo.lock -D warnings
        cargo audit --file python_bindings/Cargo.lock -D warnings

    # SBOM CycloneDX du graphe de dépendances Rust (F-19). Un par crate, les
    # trois ne formant pas un workspace. L'artefact est joint au run, jamais
    # committé (il change à chaque montée de dépendance).
    - name: Install cargo-cyclonedx
      uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
      with:
        tool: cargo-cyclonedx

    - name: SBOM (CycloneDX, Rust)
      run: |
        cargo cyclonedx --format json --manifest-path Cargo.toml
        cargo cyclonedx --format json --manifest-path gto_server/Cargo.toml
        cargo cyclonedx --format json --manifest-path python_bindings/Cargo.toml

    - name: Upload SBOMs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: sbom-rust
        path: |
          **/*.cdx.json
        if-no-files-found: ignore
