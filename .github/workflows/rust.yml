name: Rust
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings
  RUSTDOCFLAGS: --deny warnings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Install pinned toolchains
      # Épinglé sur rust-toolchain.toml : la nightly glissante fait dériver
      # les lints (-D warnings) et casse le job à chaque release Rust.
      run: |
        rustup toolchain install nightly-2025-08-01 --profile minimal --component clippy,rustfmt
        rustup component add clippy rustfmt
    - name: Build
      run: |
        cargo +nightly-2025-08-01 build --release --features zstd
        cargo +nightly-2025-08-01 build --release --features custom-alloc
        cargo +nightly-2025-08-01 run --release --example basic
        cargo +nightly-2025-08-01 run --release --example file_io
        cargo +nightly-2025-08-01 run --release --example node_locking
    - name: Run tests
      run: |
        cargo +nightly-2025-08-01 test --release --features zstd
        # NB : les tests sous --features custom-alloc échouent de façon
        # préexistante (dérive fork vs upstream) ; le chemin custom-alloc
        # est bench-only, la prod portable utilise stable+zstd.
        cargo +nightly-2025-08-01 build --release --features custom-alloc
    - name: Clippy
      run: |
        cargo +nightly-2025-08-01 clippy --release --features zstd -- -D warnings
        cargo +nightly-2025-08-01 clippy --release --features custom-alloc -- -D warnings
    - name: Check formatting
      run: cargo +nightly-2025-08-01 fmt --all --check
    - name: Check documentation
      run: cargo +nightly-2025-08-01 doc --release
