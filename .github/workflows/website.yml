name: Update Website

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install
      working-directory: ./website

    - name: Build
      run: npm run build
      working-directory: ./website

    - name: Deploy to Server
      uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
      with:
        ssh-private-key: ${{ secrets.DEPLOYMENT_KEY }}

    - name: Copy dist to server
      run: |
        ssh-keyscan dickreuter.com >> ~/.ssh/known_hosts
        scp -o StrictHostKeyChecking=yes -r ./dist/* ec2-user@dickreuter.com:/home/ec2-user/www/deepermind-pokerbot.com
      working-directory: ./website
