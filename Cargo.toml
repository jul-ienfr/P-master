[package]
name = "postflop-solver"
version = "0.1.0"
authors = ["Wataru Inariba"]
edition = "2021"
description = "An open-source postflop solver for Texas hold'em poker"
documentation = "https://b-inary.github.io/postflop_solver/postflop_solver/"
repository = "https://github.com/b-inary/postflop-solver"
license = "AGPL-3.0-only"

[dependencies]
bincode = { version = "2.0.0-rc.3", optional = true }
once_cell = "1.18.0"
rayon = { version = "1.8.0", optional = true }
regex = "1.9.6"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
# 0.12.4 → 0.14 (audit RUSTSEC du 20/11/2026) : zstd-safe 6.0.6 portait
# RUSTSEC-2026-0403 (mémoire non initialisée) et zstd-sys 2.0.16
# RUSTSEC-2026-0410. Les features utilisées (zstdmt, Encoder/Decoder) existent
# toujours en 0.14.
zstd = { version = "0.14.4", optional = true, default-features = false }

[features]
default = ["bincode", "rayon"]
custom-alloc = []
multiway-debug = []
rayon = ["dep:rayon", "zstd?/zstdmt"]
