[package]
name = "gto_server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Shared root crate exposes the solver API used by this thin HTTP wrapper.
postflop-solver = { path = "..", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }

# HTTP server — Phase 1.1 CVE: axum 0.7→0.8.4 + tower-http 0.5→0.6 allowlist CORS
axum = "0.8.4"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

# Logs
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
