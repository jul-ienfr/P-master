# Phase 1.5 — PEP 621 single source (remplace requirements_2026.txt + requirements_win/mac.txt)
# Source verrouillée via `uv lock` → uv.lock (repro). `requirements_2026.txt` reste miroir lisible jusqu'à Phase 2.
[project]
name = "poker-master"
version = "0.1.0"
description = "Super-Bot Poker 2026 — runtime V2 (vision YOLO/OCR + solver GTO + RL)"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "AGPL-3.0-only" }
dependencies = [
    # Phase 1 : Vision & OCR — cap VRAM 2.1Go (Phase 1.2/1.3 SOTA 08/2026)
    "dxcam==0.3.0; sys_platform == 'win32'",  # 0.0.5→0.3.0 DPI/multi-mon (Windows only)
    "mss==10.2.0",                         # WGC fallback (cross-platform)
    "ultralytics==8.3.197",                # YOLOv12n/s FP16 (v11 39.5→v12 40.6 mAP)
    "rapidocr>=3.2.3",                     # PP-OCRv5 montants 99%
    "surya-ocr>=0.9.2",                    # pseudos batch 92→96% (remplace easyocr)
    "onnxruntime-gpu==1.19.2; sys_platform != 'darwin'",  # LTS CC6.1 Pascal (1.3Go); pas de wheel darwin
    "opencv-python==4.11.0.86",            # 4.10→4.11 DPI
    "windows-capture==2.0.1; sys_platform == 'win32'",  # Phase 2.2 WGC HWND (occlusion-safe)

    # Phase 2 : Data & Profiling — Phase 1.7
    "asyncpg==0.31.0",
    "redis==6.4.0",                        # Valkey8 compat
    "scikit-learn>=1.5.0",
    "pandas==2.3.1",                       # 2.0.3↔2.2.2→2.3.1 harmonisé
    "pgvector==0.5.0",                     # 0.8.4 inexistant sur PyPI (max 0.5.0) — HNSW <3ms 10k×32d

    # Phase 3 : AI & Game Theory — SOTA <300Mo/<200ms
    "optuna==4.4.0",
    "torch==2.8.0",                        # inductor Ampere/Ada; Pascal off via hardware.py (2.8.1 inexistant PyPI)
    "huggingface_hub>=0.34.0",
    "safetensors>=0.5.3",
    "rlcard>=1.1.0",
    "pokerkit==0.6.2",
    "gymnasium==1.2.0",
    "numpy>=1.26.0",

    # Phase 4 : Automation & Core — CVE+DPI
    "transitions>=0.9.0",
    "uiautomation==2.0.29; sys_platform == 'win32'",  # 2.0.18→2.0.29 BoundingRectangle (Windows only)
    "pydantic==2.11.7",                    # CVE 2.7→2.11.7
    "uvicorn==0.34.3",                     # CVE 0.23→0.34

    # LLM / HTTP — CVE
    "openai==1.97.1",                      # 1.30→1.97
    "aiohttp==3.12.14",                    # 3.10→3.12.14
    "aiohttp-cors>=0.7.0",
    "pynput==1.8.1",                       # 1.7.6→1.8.1
    "tenacity>=8.2.0",                     # retry raise_for_status

    # Socle conservé (requirements_win.txt harmonisé)
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pylint>=3.0",
    "black>=24.0",
    "ruff>=0.8.0",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]
vision = [
    # Phase 2.2 — WGC promu en deps principales (Windows) ; extra conservé
    # pour les outils vision additionnels futurs.
]

[tool.uv]
# uv doit résoudre uniquement l'environnement réel (Windows 3.11).
# Sans ça, uv tente de satisfaire darwin/linux qui n'ont pas de wheel torch/ort-gpu/dxcam/uiautomation.
environments = ["sys_platform == 'win32' and python_full_version >= '3.11'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "W", "I", "B", "C4", "UP"]
lint.ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "poker/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src", "poker"]
omit = ["poker/vboxapi/*", "*/__pycache__/*", "tests/*", "poker/tests/*"]
